    description: Low power mode active.
    bit_offset: 0
    bit_size: 1
  - name: bumodets
    description: Timestamp for backup mode entry stored.
    bit_offset: 1
    bit_size: 1
  - name: ramwerr
    description: RAM write error.
    bit_offset: 2
    bit_size: 1
fieldset/regs::Syncbusy:
  description: Synchronization Busy Register.
  fields:
  - name: lpmode
    description: LPMODE Register Busy.
    bit_offset: 0
    bit_size: 1
  - name: comp0
    description: COMP0 Register Busy.
    bit_offset: 1
    bit_size: 1
fieldset/regs::Timestamp:
  description: Backup mode timestamp.
  fields:
  - name: timestamp
    description: Backup mode timestamp.
    bit_offset: 0
    bit_size: 32
enum/vals::Clksel:
  bit_size: 2
  variants:
  - name: Lfrco
    description: LFRCO selected as BURTC clock source.
    value: 1
  - name: Lfxo
    description: LFXO selected as BURTC clock source.
    value: 2
  - name: None
    description: No clock source selected for BURTC.
    value: 0
  - name: Ulfrco
    description: ULFRCO selected as BURTC clock source.
    value: 3
enum/vals::Lockkey:
  bit_size: 16
  variants:
  - name: Locked
    value: 1
  - name: Unlocked
    value: 0
enum/vals::Lpcomp:
  bit_size: 3
  variants:
  - name: Ign0lsb
    description: Do not ignore any bits for compare match evaluation.
    value: 0
  - name: Ign1lsb
    description: The LSB of the counter is ignored for compare match evaluation.
    value: 1
  - name: Ign2lsb
    description: The two LSBs of the counter are ignored for compare match evaluation.
    value: 2
  - name: Ign3lsb
    description: The three LSBs of the counter are ignored for compare match evaluation.
    value: 3
  - name: Ign4lsb
    description: The four LSBs of the counter are ignored for compare match evaluation.
    value: 4
  - name: Ign5lsb
    description: The five LSBs of the counter are ignored for compare match evaluation.
    value: 5
  - name: Ign6lsb
    description: The six LSBs of the counter are ignored for compare match evaluation.
    value: 6
  - name: Ign7lsb
    description: The seven LSBs of the counter are ignored for compare match evaluation.
    value: 7
enum/vals::Lpmode:
  bit_size: 2
  variants:
  - name: Buen
    description: Low power mode enabled in backup mode.
    value: 2
  - name: Disable
    description: Low power mode is disabled.
    value: 0
  - name: Enable
    description: Low power mode always enabled.
    value: 1
enum/vals::Mode:
  bit_size: 2
  variants:
  - name: Disable
    description: The BURTC is disabled.
    value: 0
  - name: Em2en
    description: The BURTC is in normal operating mode, operating in EM0-EM2. Oscillators must be enabled in CMU for use.
    value: 1
  - name: Em3en
    description: The BURTC is enabled in EM0-EM3. Will prevent CMU from disabling used oscillators all the way down to EM3.
    value: 2
  - name: Em4en
    description: The BURTC is enabled in EM0-EM4. Will prevent CMU from disabling used oscillators all the way down to EM4.
    value: 3
enum/vals::Osc:
  bit_size: 2
  variants:
  - name: Disable
    description: LFXO failure detection disabled.
    value: 0
  - name: Lfrco
    description: LFRCO used for LFXO failure detection.
    value: 1
  - name: Ulfrco
    description: ULFRCO used for LFXO failure detection.
    value: 2
enum/vals::Presc:
  bit_size: 3
  variants:
  - name: Div1
    description: No prescaling.
    value: 0
  - name: Div128
    description: Prescaling factor of 128.
    value: 7
  - name: Div16
    description: Prescaling factor of 16.
    value: 4
  - name: Div2
    description: Prescaling factor of 2.
    value: 1
  - name: Div32
    description: Prescaling factor of 32.
    value: 5
  - name: Div4
    description: Prescaling factor of 4.
    value: 2
  - name: Div64
    description: Prescaling factor of 64.
    value: 6
  - name: Div8
    description: Prescaling factor of 8.
    value: 3
