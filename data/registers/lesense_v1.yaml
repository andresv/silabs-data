    description: The channel configuration register registers used are directly mapped to the channel number.
    value: 0
  - name: Invmap
    description: The channel configuration registers used are CH[X+8]_CONF for channels 0-7 and CH[X-8]_CONF for channels 8-15.
    value: 1
  - name: Toggle
    description: The channel configuration registers used toggle between CH[X]_CONF and CH[X+8]_CONF when channel x triggers.
    value: 2
enum/vals::Scanmode:
  bit_size: 2
  variants:
  - name: Oneshot
    description: A single scan is performed when START in CMD is set.
    value: 1
  - name: Periodic
    description: A new scan is started each time the period counter overflows.
    value: 0
  - name: Prs
    description: Pulse on PRS channel.
    value: 2
