    bit_size: 1
  - name: comp0
    description: COMP0 Register Busy.
    bit_offset: 2
    bit_size: 1
  - name: comp1
    description: COMP1 Register Busy.
    bit_offset: 3
    bit_size: 1
  - name: rep0
    description: REP0 Register Busy.
