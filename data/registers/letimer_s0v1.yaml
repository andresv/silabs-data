enum/vals::Location:
  bit_size: 3
  variants:
  - name: Loc0
    description: Location 0.
    value: 0
  - name: Loc1
    description: Location 1.
    value: 1
  - name: Loc2
    description: Location 2.
    value: 2
  - name: Loc3
    description: Location 3.
    value: 3
enum/vals::Repmode:
  bit_size: 2
  variants:
  - name: Buffered
    description: The counter counts REP0 times. If REP1 has been written, it is loaded into REP0 when REP0 reaches zero. Else the counter stops.
    value: 2
  - name: Double
    description: Both REP0 and REP1 are decremented when the LETIMER wraps around. The LETIMER counts until both REP0 and REP1 are zero.
    value: 3
  - name: Free
    description: When started, the LETIMER counts down until it is stopped by software.
    value: 0
  - name: Oneshot
    description: The counter counts REP0 times. When REP0 reaches zero, the counter stops.
    value: 1
enum/vals::Ufoa0:
  bit_size: 2
  variants:
  - name: None
    description: LETn_O0 is held at its idle value as defined by OPOL0.
    value: 0
  - name: Pulse
    description: LETn_O0 is held active for one LFACLKLETIMER0 clock cycle on CNT underflow. The output then returns to its idle value as defined by OPOL0.
    value: 2
  - name: Pwm
    description: LETn_O0 is set idle on CNT underflow, and active on compare match with COMP1.
    value: 3
  - name: Toggle
    description: LETn_O0 is toggled on CNT underflow.
    value: 1
enum/vals::Ufoa1:
  bit_size: 2
  variants:
  - name: None
    description: LETn_O1 is held at its idle value as defined by OPOL1.
    value: 0
  - name: Pulse
    description: LETn_O1 is held active for one LFACLKLETIMER0 clock cycle on CNT underflow. The output then returns to its idle value as defined by OPOL1.
    value: 2
  - name: Pwm
    description: LETn_O1 is set idle on CNT underflow, and active on compare match with COMP1.
    value: 3
  - name: Toggle
    description: LETn_O1 is toggled on CNT underflow.
    value: 1
