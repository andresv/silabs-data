fieldset/regs::PortCtrl:
  description: Port Control Register.
  fields:
  - name: drivemode
    description: Drive Mode Select.
    bit_offset: 0
    bit_size: 2
    enum: vals::Drivemode
fieldset/regs::PortDin:
  description: Port Data In Register.
  fields:
  - name: din
    description: Data In.
    bit_offset: 0
    bit_size: 16
fieldset/regs::PortDout:
  description: Port Data Out Register.
  fields:
  - name: dout
    description: Data Out.
    bit_offset: 0
    bit_size: 16
fieldset/regs::PortDoutclr:
  description: Port Data Out Clear Register.
  fields:
  - name: doutclr
    description: Data Out Clear.
    bit_offset: 0
    bit_size: 16
fieldset/regs::PortDoutset:
  description: Port Data Out Set Register.
