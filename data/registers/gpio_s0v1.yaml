    description: Pin 8 Mode.
    bit_offset: 0
    bit_size: 4
    array:
      len: 8
      stride: 4
    enum: vals::Mode
fieldset/regs::PortModel:
  description: Port Pin Mode Low Register.
  fields:
  - name: mode
    description: Pin 0 Mode.
    bit_offset: 0
    bit_size: 4
    array:
      len: 8
      stride: 4
    enum: vals::Mode
fieldset/regs::PortPinlockn:
  description: Port Unlocked Pins Register.
  fields:
  - name: pinlockn
    description: Unlocked Pins.
    bit_offset: 0
    bit_size: 16
fieldset/regs::Route:
  description: I/O Routing Register.
  fields:
  - name: swclkpen
    description: Serial Wire Clock Pin Enable.
    bit_offset: 0
    bit_size: 1
  - name: swdiopen
    description: Serial Wire Data Pin Enable.
    bit_offset: 1
    bit_size: 1
  - name: swopen
    description: Serial Wire Viewer Output Pin Enable.
    bit_offset: 2
    bit_size: 1
  - name: swlocation
    description: I/O Location.
    bit_offset: 8
    bit_size: 2
    enum: vals::Swlocation
  - name: tclkpen
    description: ETM Trace Clock Pin Enable.
    bit_offset: 12
    bit_size: 1
  - name: td0pen
    description: ETM Trace Data Pin Enable.
    bit_offset: 13
    bit_size: 1
  - name: td1pen
    description: ETM Trace Data Pin Enable.
    bit_offset: 14
    bit_size: 1
  - name: td2pen
    description: ETM Trace Data Pin Enable.
    bit_offset: 15
    bit_size: 1
  - name: td3pen
    description: ETM Trace Data Pin Enable.
    bit_offset: 16
    bit_size: 1
  - name: etmlocation
    description: I/O Location.
    bit_offset: 24
    bit_size: 2
    enum: vals::Etmlocation
enum/vals::Drivemode:
  bit_size: 2
  variants:
  - name: High
    description: 20 mA drive current.
    value: 2
  - name: Low
    description: 1 mA drive current.
    value: 3
  - name: Lowest
    description: 0.1 mA drive current.
    value: 1
  - name: Standard
    description: 6 mA drive current.
    value: 0
enum/vals::Em4wucause:
  bit_size: 6
  variants:
  - name: A0
    description: This bit indicates an em4 wake-up request occurred on pin A0.
    value: 1
  - name: A6
    description: This bit indicates an em4 wake-up request occurred on pin A6.
    value: 2
  - name: C9
    description: This bit indicates an em4 wake-up request occurred on pin C9.
    value: 4
  - name: E13
    description: This bit indicates an em4 wake-up request occurred on pin E13.
    value: 32
  - name: F1
    description: This bit indicates an em4 wake-up request occurred on pin F1.
    value: 8
  - name: F2
    description: This bit indicates an em4 wake-up request occurred on pin F2.
    value: 16
enum/vals::Em4wuen:
  bit_size: 6
  variants:
  - name: A0
    description: Enable em4 wakeup on pin A0.
    value: 1
  - name: A6
    description: Enable em4 wakeup on pin A6.
    value: 2
  - name: C9
    description: Enable em4 wakeup on pin C9.
    value: 4
  - name: E13
    description: Enable em4 wakeup on pin E13.
    value: 32
  - name: F1
    description: Enable em4 wakeup on pin F1.
    value: 8
  - name: F2
    description: Enable em4 wakeup on pin F2.
    value: 16
enum/vals::Em4wupol:
  bit_size: 6
  variants:
  - name: A0
    description: Determines polarity on pin A0.
    value: 1
  - name: A6
    description: Determines polarity on pin A6.
    value: 2
  - name: C9
    description: Determines polarity on pin C9.
    value: 4
  - name: E13
    description: Determines polarity on pin E13.
    value: 32
  - name: F1
    description: Determines polarity on pin F1.
    value: 8
  - name: F2
    description: Determines polarity on pin F2.
    value: 16
enum/vals::Etmlocation:
  bit_size: 2
  variants:
  - name: Loc0
    description: Location 0.
    value: 0
  - name: Loc1
    description: Location 1.
    value: 1
  - name: Loc2
    description: Location 2.
    value: 2
  - name: Loc3
    description: Location 3.
    value: 3
enum/vals::Extipsel:
  bit_size: 3
  variants:
  - name: Porta
    description: Port A pin 0 selected for external interrupt 0.
    value: 0
  - name: Portb
    description: Port B pin 0 selected for external interrupt 0.
    value: 1
  - name: Portc
    description: Port C pin 0 selected for external interrupt 0.
    value: 2
  - name: Portd
    description: Port D pin 0 selected for external interrupt 0.
    value: 3
  - name: Porte
    description: Port E pin 0 selected for external interrupt 0.
    value: 4
  - name: Portf
    description: Port F pin 0 selected for external interrupt 0.
    value: 5
enum/vals::Lockkey:
  bit_size: 16
  variants:
  - name: Locked
    value: 1
  - name: Unlocked
    value: 0
enum/vals::Mode:
  bit_size: 4
  variants:
  - name: Disabled
    description: Input disabled. Pullup if DOUT is set.
    value: 0
  - name: Input
    description: Input enabled. Filter if DOUT is set.
    value: 1
  - name: Inputpull
    description: Input enabled. DOUT determines pull direction.
    value: 2
  - name: Inputpullfilter
    description: Input enabled with filter. DOUT determines pull direction.
    value: 3
  - name: Pushpull
    description: Push-pull output.
    value: 4
  - name: Pushpulldrive
    description: Push-pull output with drive-strength set by DRIVEMODE.
    value: 5
  - name: Wiredand
    description: Open-drain output.
    value: 8
  - name: Wiredanddrive
    description: Open-drain output with drive-strength set by DRIVEMODE.
    value: 12
  - name: Wiredanddrivefilter
    description: Open-drain output with filter and drive-strength set by DRIVEMODE.
    value: 13
  - name: Wiredanddrivepullup
    description: Open-drain output with pullup and drive-strength set by DRIVEMODE.
    value: 14
  - name: Wiredanddrivepullupfilter
    description: Open-drain output with filter, pullup and drive-strength set by DRIVEMODE.
    value: 15
  - name: Wiredandfilter
    description: Open-drain output with filter.
    value: 9
  - name: Wiredandpullup
    description: Open-drain output with pullup.
    value: 10
  - name: Wiredandpullupfilter
    description: Open-drain output with filter and pullup.
    value: 11
  - name: Wiredor
    description: Wired-or output.
    value: 6
  - name: Wiredorpulldown
    description: Wired-or output with pull-down.
    value: 7
enum/vals::Swlocation:
  bit_size: 2
  variants:
  - name: Loc0
    description: Location 0.
    value: 0
  - name: Loc1
    description: Location 1.
    value: 1
  - name: Loc2
    description: Location 2.
    value: 2
  - name: Loc3
    description: Location 3.
    value: 3
