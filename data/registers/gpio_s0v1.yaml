    bit_offset: 28
    bit_size: 3
    enum: vals::Extipsel
fieldset/regs::Extirise:
  description: External Interrupt Rising Edge Trigger Register.
  fields:
  - name: extirise
    description: External Interrupt n Rising Edge Trigger Enable.
    bit_offset: 0
    bit_size: 16
fieldset/regs::Ien:
  description: Interrupt Enable Register.
  fields:
  - name: ext
    description: External Interrupt n Enable.
    bit_offset: 0
    bit_size: 16
fieldset/regs::If:
  description: Interrupt Flag Register.
  fields:
  - name: ext
    description: External Interrupt Flag n.
    bit_offset: 0
    bit_size: 16
fieldset/regs::Insense:
  description: Input Sense Register.
  fields:
  - name: int
    description: Interrupt Sense Enable.
