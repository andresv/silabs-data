    byte_offset: 276
    access: Read
    fieldset: regs::If
  - name: if_set
    description: Interrupt Flag Set Register (IFS in the reference manual).
    byte_offset: 280
    access: Write
    fieldset: regs::If
  - name: if_clr
    description: Interrupt Flag Clear Register (IFC in the reference manual).
    byte_offset: 284
    access: Write
    fieldset: regs::If
  - name: route
    description: I/O Routing Register.
    byte_offset: 288
    fieldset: regs::Route
  - name: insense
    description: Input Sense Register.
    byte_offset: 292
    fieldset: regs::Insense
  - name: lock
    description: Configuration Lock Register.
    byte_offset: 296
    fieldset: regs::Lock
  - name: ctrl
    description: GPIO Control Register.
    byte_offset: 300
    fieldset: regs::Ctrl
  - name: cmd
    description: GPIO Command Register.
    byte_offset: 304
    access: Write
    fieldset: regs::Cmd
  - name: em4wuen
    description: EM4 Wake-up Enable Register.
    byte_offset: 308
    fieldset: regs::Em4wuen
  - name: em4wupol
    description: EM4 Wake-up Polarity Register.
    byte_offset: 312
    fieldset: regs::Em4wupol
  - name: em4wucause
    description: EM4 Wake-up Cause Register.
    byte_offset: 316
    access: Read
    fieldset: regs::Em4wucause
fieldset/regs::Cmd:
  description: GPIO Command Register.
