    description: PRS Sense Enable.
    bit_offset: 1
    bit_size: 1
fieldset/regs::Lock:
  description: Configuration Lock Register.
  fields:
  - name: lockkey
    description: Configuration Lock Key.
    bit_offset: 0
    bit_size: 16
