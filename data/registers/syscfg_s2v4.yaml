  - name: Allon
    description: no banks powered down.
    value: 0
  - name: Blk1to3
    description: power down blk 1 to 3.
    value: 14
  - name: Blk2to3
    description: power down blk 2 to 3.
    value: 12
  - name: Blk3
    description: power down blk3.
    value: 8
