block/Acmp:
  description: ACMP peripheral.
  items:
  - name: ctrl
    description: Control Register.
    byte_offset: 0
    fieldset: regs::Ctrl
  - name: inputsel
    description: Input Selection Register.
    byte_offset: 4
    fieldset: regs::Inputsel
  - name: status
    description: Status Register.
    byte_offset: 8
    access: Read
    fieldset: regs::Status
  - name: ien
    description: Interrupt Enable Register.
    byte_offset: 12
    fieldset: regs::Ien
  - name: if_
    description: Interrupt Flag Register.
    byte_offset: 16
    access: Read
    fieldset: regs::If
  - name: if_set
    description: Interrupt Flag Set Register (IFS in the reference manual).
    byte_offset: 20
    access: Write
    fieldset: regs::If
  - name: if_clr
    description: Interrupt Flag Clear Register (IFC in the reference manual).
    byte_offset: 24
    access: Write
    fieldset: regs::If
  - name: route
    description: I/O Routing Register.
    byte_offset: 28
    fieldset: regs::Route
fieldset/regs::Ctrl:
  description: Control Register.
  fields:
  - name: en
    description: Analog Comparator Enable.
    bit_offset: 0
    bit_size: 1
  - name: muxen
    description: Input Mux Enable.
    bit_offset: 1
    bit_size: 1
  - name: inactval
    description: Inactive Value.
    bit_offset: 2
    bit_size: 1
  - name: gpioinv
    description: Comparator GPIO Output Invert.
    bit_offset: 3
    bit_size: 1
  - name: hystsel
    description: Hysteresis Select.
    bit_offset: 4
    bit_size: 3
    enum: vals::Hystsel
  - name: warmtime
    description: Warm-up Time.
    bit_offset: 8
    bit_size: 3
    enum: vals::Warmtime
  - name: irise
    description: Rising Edge Interrupt Sense.
    bit_offset: 16
    bit_size: 1
  - name: ifall
    description: Falling Edge Interrupt Sense.
    bit_offset: 17
    bit_size: 1
  - name: biasprog
    description: Bias Configuration.
    bit_offset: 24
    bit_size: 4
  - name: halfbias
    description: Half Bias Current.
    bit_offset: 30
    bit_size: 1
  - name: fullbias
    description: Full Bias Current.
    bit_offset: 31
    bit_size: 1
fieldset/regs::Ien:
  description: Interrupt Enable Register.
  fields:
  - name: edge
    description: Edge Trigger Interrupt Enable.
    bit_offset: 0
    bit_size: 1
  - name: warmup
    description: Warm-up Interrupt Enable.
    bit_offset: 1
    bit_size: 1
fieldset/regs::If:
  description: Interrupt Flag Register.
  fields:
  - name: edge
    description: Edge Triggered Interrupt Flag.
    bit_offset: 0
    bit_size: 1
  - name: warmup
    description: Warm-up Interrupt Flag.
    bit_offset: 1
    bit_size: 1
fieldset/regs::Inputsel:
  description: Input Selection Register.
  fields:
  - name: possel
    description: Positive Input Select.
    bit_offset: 0
    bit_size: 3
    enum: vals::Possel
  - name: negsel
    description: Negative Input Select.
    bit_offset: 4
    bit_size: 4
    enum: vals::Negsel
  - name: vddlevel
    description: VDD Reference Level.
    bit_offset: 8
    bit_size: 6
  - name: lpref
    description: Low Power Reference Mode.
    bit_offset: 16
    bit_size: 1
  - name: csresen
    description: Capacitive Sense Mode Internal Resistor Enable.
    bit_offset: 24
    bit_size: 1
  - name: csressel
    description: Capacitive Sense Mode Internal Resistor Select.
    bit_offset: 28
    bit_size: 2
    enum: vals::Csressel
fieldset/regs::Route:
  description: I/O Routing Register.
  fields:
  - name: acmppen
    description: ACMP Output Pin Enable.
    bit_offset: 0
    bit_size: 1
  - name: location
    description: I/O Location.
    bit_offset: 8
    bit_size: 3
    enum: vals::Location
fieldset/regs::Status:
  description: Status Register.
  fields:
  - name: acmpact
    description: Analog Comparator Active.
    bit_offset: 0
    bit_size: 1
  - name: acmpout
    description: Analog Comparator Output.
    bit_offset: 1
    bit_size: 1
enum/vals::Csressel:
  bit_size: 2
  variants:
  - name: Res0
    description: Internal capacitive sense resistor value 0.
    value: 0
  - name: Res1
    description: Internal capacitive sense resistor value 1.
    value: 1
  - name: Res2
    description: Internal capacitive sense resistor value 2.
    value: 2
  - name: Res3
    description: Internal capacitive sense resistor value 3.
    value: 3
enum/vals::Hystsel:
  bit_size: 3
  variants:
  - name: Hyst0
    description: No hysteresis.
    value: 0
  - name: Hyst1
    description: ~15 mV hysteresis.
    value: 1
  - name: Hyst2
    description: ~22 mV hysteresis.
    value: 2
  - name: Hyst3
    description: ~29 mV hysteresis.
    value: 3
  - name: Hyst4
    description: ~36 mV hysteresis.
    value: 4
  - name: Hyst5
    description: ~43 mV hysteresis.
    value: 5
  - name: Hyst6
    description: ~50 mV hysteresis.
    value: 6
  - name: Hyst7
    description: ~57 mV hysteresis.
    value: 7
enum/vals::Location:
  bit_size: 3
  variants:
  - name: Loc0
    description: Location 0.
    value: 0
  - name: Loc1
    description: Location 1.
    value: 1
  - name: Loc2
    description: Location 2.
    value: 2
enum/vals::Negsel:
  bit_size: 4
  variants:
  - name: Capsense
    description: Capacitive sense mode.
    value: 11
  - name: Ch0
    description: Channel 0 as negative input.
    value: 0
  - name: Ch1
    description: Channel 1 as negative input.
    value: 1
  - name: Ch2
    description: Channel 2 as negative input.
    value: 2
  - name: Ch3
    description: Channel 3 as negative input.
    value: 3
  - name: Ch4
    description: Channel 4 as negative input.
    value: 4
  - name: Ch5
    description: Channel 5 as negative input.
    value: 5
  - name: Ch6
    description: Channel 6 as negative input.
    value: 6
  - name: Ch7
    description: Channel 7 as negative input.
    value: 7
  - name: Dac0ch0
    description: DAC0 channel 0.
    value: 12
  - name: Dac0ch1
    description: DAC0 channel 1.
    value: 13
  - name: Vdd
    description: Scaled VDD as negative input.
    value: 10
  - name: _1v25
    description: 1.25 V as negative input.
    value: 8
  - name: _2v5
    description: 2.5 V as negative input.
    value: 9
enum/vals::Possel:
  bit_size: 3
  variants:
  - name: Ch0
    description: Channel 0 as positive input.
    value: 0
  - name: Ch1
    description: Channel 1 as positive input.
    value: 1
  - name: Ch2
    description: Channel 2 as positive input.
    value: 2
  - name: Ch3
    description: Channel 3 as positive input.
    value: 3
  - name: Ch4
    description: Channel 4 as positive input.
    value: 4
  - name: Ch5
    description: Channel 5 as positive input.
    value: 5
  - name: Ch6
    description: Channel 6 as positive input.
    value: 6
  - name: Ch7
    description: Channel 7 as positive input.
    value: 7
enum/vals::Warmtime:
  bit_size: 3
  variants:
  - name: _128cycles
    description: 128 HFPERCLK cycles.
    value: 5
  - name: _16cycles
    description: 16 HFPERCLK cycles.
    value: 2
  - name: _256cycles
    description: 256 HFPERCLK cycles.
    value: 6
  - name: _32cycles
    description: 32 HFPERCLK cycles.
    value: 3
  - name: _4cycles
    description: 4 HFPERCLK cycles.
    value: 0
  - name: _512cycles
    description: 512 HFPERCLK cycles.
    value: 7
  - name: _64cycles
    description: 64 HFPERCLK cycles.
    value: 4
  - name: _8cycles
    description: 8 HFPERCLK cycles.
    value: 1
