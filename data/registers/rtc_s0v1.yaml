    description: Compare Match 0 Interrupt Flag.
    bit_offset: 1
    bit_size: 1
  - name: comp1
    description: Compare Match 1 Interrupt Flag.
    bit_offset: 2
    bit_size: 1
fieldset/regs::Syncbusy:
  description: Synchronization Busy Register.
  fields:
  - name: ctrl
    description: CTRL Register Busy.
    bit_offset: 0
    bit_size: 1
  - name: comp0
    description: COMP0 Register Busy.
    bit_offset: 1
    bit_size: 1
  - name: comp1
    description: COMP1 Register Busy.
    bit_offset: 2
    bit_size: 1
