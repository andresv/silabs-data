  - name: single
    description: Single Conversion Complete Interrupt Flag.
    bit_offset: 0
    bit_size: 1
  - name: scan
    description: Scan Conversion Complete Interrupt Flag.
    bit_offset: 1
    bit_size: 1
  - name: singleof
    description: Single Result Overflow Interrupt Flag.
    bit_offset: 8
    bit_size: 1
  - name: scanof
    description: Scan Result Overflow Interrupt Flag.
    bit_offset: 9
    bit_size: 1
fieldset/regs::Ifc:
  description: Interrupt Flag Clear Register.
  fields:
  - name: single
    description: Single Conversion Complete Interrupt Flag Clear.
    bit_offset: 0
    bit_size: 1
  - name: scan
    description: Scan Conversion Complete Interrupt Flag Clear.
    bit_offset: 1
    bit_size: 1
  - name: singleof
    description: Single Result Overflow Interrupt Flag Clear.
    bit_offset: 8
    bit_size: 1
  - name: scanof
    description: Scan Result Overflow Interrupt Flag Clear.
    bit_offset: 9
    bit_size: 1
fieldset/regs::Ifs:
  description: Interrupt Flag Set Register.
  fields:
  - name: single
    description: Single Conversion Complete Interrupt Flag Set.
    bit_offset: 0
    bit_size: 1
  - name: scan
    description: Scan Conversion Complete Interrupt Flag Set.
    bit_offset: 1
    bit_size: 1
  - name: singleof
    description: Single Result Overflow Interrupt Flag Set.
    bit_offset: 8
    bit_size: 1
  - name: scanof
    description: Scan Result Overflow Interrupt Flag Set.
    bit_offset: 9
    bit_size: 1
fieldset/regs::Scanctrl:
  description: Scan Control Register.
  fields:
  - name: rep
    description: Scan Sequence Repetitive Mode.
    bit_offset: 0
    bit_size: 1
  - name: diff
    description: Scan Sequence Differential Mode.
    bit_offset: 1
    bit_size: 1
  - name: adj
    description: Scan Sequence Result Adjustment.
    bit_offset: 2
    bit_size: 1
  - name: res
    description: Scan Sequence Resolution Select.
    bit_offset: 4
    bit_size: 2
    enum: vals::ScanctrlRes
  - name: inputmask
    description: Scan Sequence Input Mask.
    bit_offset: 8
    bit_size: 8
  - name: ref_
    description: Scan Sequence Reference Selection.
    bit_offset: 16
    bit_size: 3
    enum: vals::ScanctrlRef
  - name: at
    description: Scan Sample Acquisition Time.
    bit_offset: 20
    bit_size: 4
    enum: vals::ScanctrlAt
  - name: prsen
    description: Scan Sequence PRS Trigger Enable.
    bit_offset: 24
    bit_size: 1
  - name: prssel
    description: Scan Sequence PRS Trigger Select.
    bit_offset: 28
    bit_size: 4
    enum: vals::ScanctrlPrssel
fieldset/regs::Scandata:
  description: Scan Conversion Result Data.
  fields:
  - name: data
    description: Scan Conversion Result Data.
    bit_offset: 0
    bit_size: 32
fieldset/regs::Scandatap:
  description: Scan Sequence Result Data Peek Register.
  fields:
  - name: datap
    description: Scan Conversion Result Data Peek.
    bit_offset: 0
    bit_size: 32
fieldset/regs::Singlectrl:
  description: Single Sample Control Register.
  fields:
  - name: rep
    description: Single Sample Repetitive Mode.
    bit_offset: 0
    bit_size: 1
  - name: diff
    description: Single Sample Differential Mode.
    bit_offset: 1
    bit_size: 1
  - name: adj
    description: Single Sample Result Adjustment.
    bit_offset: 2
    bit_size: 1
  - name: res
    description: Single Sample Resolution Select.
    bit_offset: 4
    bit_size: 2
    enum: vals::SinglectrlRes
  - name: inputsel
    description: Single Sample Input Selection.
    bit_offset: 8
    bit_size: 4
  - name: ref_
    description: Single Sample Reference Selection.
    bit_offset: 16
    bit_size: 3
    enum: vals::SinglectrlRef
  - name: at
    description: Single Sample Acquisition Time.
    bit_offset: 20
    bit_size: 4
    enum: vals::SinglectrlAt
  - name: prsen
    description: Single Sample PRS Trigger Enable.
    bit_offset: 24
    bit_size: 1
  - name: prssel
    description: Single Sample PRS Trigger Select.
    bit_offset: 28
    bit_size: 4
    enum: vals::SinglectrlPrssel
fieldset/regs::Singledata:
  description: Single Conversion Result Data.
  fields:
  - name: data
    description: Single Conversion Result Data.
    bit_offset: 0
    bit_size: 32
fieldset/regs::Singledatap:
  description: Single Conversion Result Data Peek Register.
  fields:
  - name: datap
    description: Single Conversion Result Data Peek.
    bit_offset: 0
    bit_size: 32
fieldset/regs::Status:
  description: Status Register.
  fields:
