block/Adc:
  description: ADC peripheral.
  items:
  - name: ctrl
    description: Control Register.
    byte_offset: 0
    fieldset: regs::Ctrl
  - name: cmd
    description: Command Register.
    byte_offset: 4
    access: Write
    fieldset: regs::Cmd
  - name: status
    description: Status Register.
    byte_offset: 8
    access: Read
    fieldset: regs::Status
  - name: singlectrl
    description: Single Sample Control Register.
    byte_offset: 12
    fieldset: regs::Singlectrl
  - name: scanctrl
    description: Scan Control Register.
    byte_offset: 16
    fieldset: regs::Scanctrl
  - name: ien
    description: Interrupt Enable Register.
    byte_offset: 20
    fieldset: regs::Ien
  - name: if_
    description: Interrupt Flag Register.
    byte_offset: 24
    access: Read
    fieldset: regs::If
  - name: ifs
    description: Interrupt Flag Set Register.
    byte_offset: 28
    access: Write
    fieldset: regs::Ifs
  - name: ifc
    description: Interrupt Flag Clear Register.
    byte_offset: 32
    access: Write
    fieldset: regs::Ifc
  - name: singledata
    description: Single Conversion Result Data.
    byte_offset: 36
    access: Read
    fieldset: regs::Singledata
  - name: scandata
    description: Scan Conversion Result Data.
    byte_offset: 40
    access: Read
    fieldset: regs::Scandata
  - name: singledatap
    description: Single Conversion Result Data Peek Register.
    byte_offset: 44
    access: Read
    fieldset: regs::Singledatap
  - name: scandatap
    description: Scan Sequence Result Data Peek Register.
    byte_offset: 48
    access: Read
    fieldset: regs::Scandatap
  - name: cal
    description: Calibration Register.
    byte_offset: 52
    fieldset: regs::Cal
  - name: biasprog
    description: Bias Programming Register.
    byte_offset: 60
    fieldset: regs::Biasprog
fieldset/regs::Biasprog:
  description: Bias Programming Register.
  fields:
  - name: biasprog
    description: Bias Programming Value.
    bit_offset: 0
    bit_size: 4
  - name: halfbias
    description: Half Bias Current.
    bit_offset: 6
    bit_size: 1
  - name: compbias
    description: Comparator Bias Value.
    bit_offset: 8
    bit_size: 4
fieldset/regs::Cal:
  description: Calibration Register.
  fields:
  - name: singleoffset
    description: Single Mode Offset Calibration Value.
    bit_offset: 0
    bit_size: 7
  - name: singlegain
    description: Single Mode Gain Calibration Value.
    bit_offset: 8
    bit_size: 7
  - name: scanoffset
    description: Scan Mode Offset Calibration Value.
    bit_offset: 16
    bit_size: 7
  - name: scangain
    description: Scan Mode Gain Calibration Value.
    bit_offset: 24
    bit_size: 7
fieldset/regs::Cmd:
  description: Command Register.
  fields:
  - name: singlestart
    description: Single Conversion Start.
    bit_offset: 0
    bit_size: 1
  - name: singlestop
    description: Single Conversion Stop.
    bit_offset: 1
    bit_size: 1
  - name: scanstart
    description: Scan Sequence Start.
    bit_offset: 2
    bit_size: 1
  - name: scanstop
    description: Scan Sequence Stop.
    bit_offset: 3
    bit_size: 1
fieldset/regs::Ctrl:
  description: Control Register.
  fields:
  - name: warmupmode
    description: Warm-up Mode.
    bit_offset: 0
    bit_size: 2
    enum: vals::Warmupmode
  - name: tailgate
    description: Conversion Tailgating.
    bit_offset: 3
    bit_size: 1
  - name: lpfmode
    description: Low Pass Filter Mode.
    bit_offset: 4
    bit_size: 2
    enum: vals::Lpfmode
  - name: presc
    description: Prescaler Setting.
    bit_offset: 8
    bit_size: 7
    enum: vals::Presc
  - name: timebase
    description: Time Base.
    bit_offset: 16
    bit_size: 5
  - name: ovsrsel
    description: Oversample Rate Select.
    bit_offset: 24
    bit_size: 4
    enum: vals::Ovsrsel
fieldset/regs::Ien:
  description: Interrupt Enable Register.
  fields:
  - name: single
    description: Single Conversion Complete Interrupt Enable.
    bit_offset: 0
    bit_size: 1
  - name: scan
    description: Scan Conversion Complete Interrupt Enable.
    bit_offset: 1
    bit_size: 1
  - name: singleof
    description: Single Result Overflow Interrupt Enable.
    bit_offset: 8
    bit_size: 1
  - name: scanof
    description: Scan Result Overflow Interrupt Enable.
    bit_offset: 9
    bit_size: 1
fieldset/regs::If:
  description: Interrupt Flag Register.
