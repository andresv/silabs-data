    description: Single Conversion Active.
    bit_offset: 0
    bit_size: 1
  - name: scanact
    description: Scan Conversion Active.
    bit_offset: 1
    bit_size: 1
  - name: singlerefwarm
    description: Single Reference Warmed Up.
    bit_offset: 8
    bit_size: 1
  - name: scanrefwarm
    description: Scan Reference Warmed Up.
    bit_offset: 9
    bit_size: 1
  - name: warm
    description: ADC Warmed Up.
    bit_offset: 12
    bit_size: 1
  - name: singledv
    description: Single Sample Data Valid.
    bit_offset: 16
    bit_size: 1
  - name: scandv
    description: Scan Data Valid.
    bit_offset: 17
    bit_size: 1
  - name: scandatasrc
    description: Scan Data Source.
    bit_offset: 24
    bit_size: 3
    enum: vals::Scandatasrc
enum/vals::Lpfmode:
  bit_size: 2
  variants:
  - name: Bypass
    description: No filter or decoupling capacitor.
    value: 0
  - name: Decap
    description: On chip decoupling capacitor selected.
    value: 1
  - name: Rcfilt
    description: On chip RC filter selected.
    value: 2
enum/vals::Ovsrsel:
  bit_size: 4
  variants:
  - name: X1024
    description: 1024 samples for each conversion result.
    value: 9
  - name: X128
    description: 128 samples for each conversion result.
    value: 6
  - name: X16
    description: 16 samples for each conversion result.
    value: 3
  - name: X2
    description: 2 samples for each conversion result.
    value: 0
  - name: X2048
    description: 2048 samples for each conversion result.
    value: 10
  - name: X256
    description: 256 samples for each conversion result.
    value: 7
  - name: X32
    description: 32 samples for each conversion result.
    value: 4
  - name: X4
    description: 4 samples for each conversion result.
    value: 1
  - name: X4096
    description: 4096 samples for each conversion result.
    value: 11
  - name: X512
    description: 512 samples for each conversion result.
    value: 8
  - name: X64
    description: 64 samples for each conversion result.
    value: 5
  - name: X8
    description: 8 samples for each conversion result.
    value: 2
enum/vals::Presc:
  bit_size: 7
  variants:
  - name: Nodivision
    value: 0
enum/vals::ScanctrlAt:
  bit_size: 4
  variants:
  - name: _128cycles
    description: 128 ADC_CLK cycles acquisition time for scan samples.
    value: 7
  - name: _16cycles
    description: 16 ADC_CLK cycles acquisition time for scan samples.
    value: 4
  - name: _1cycle
    description: 1 ADC_CLK cycle acquisition time for scan samples.
    value: 0
  - name: _256cycles
    description: 256 ADC_CLK cycles acquisition time for scan samples.
    value: 8
  - name: _2cycles
    description: 2 ADC_CLK cycles acquisition time for scan samples.
    value: 1
  - name: _32cycles
    description: 32 ADC_CLK cycles acquisition time for scan samples.
    value: 5
  - name: _4cycles
    description: 4 ADC_CLK cycles acquisition time for scan samples.
    value: 2
  - name: _64cycles
    description: 64 ADC_CLK cycles acquisition time for scan samples.
    value: 6
  - name: _8cycles
    description: 8 ADC_CLK cycles acquisition time for scan samples.
    value: 3
enum/vals::ScanctrlPrssel:
  bit_size: 4
  variants:
  - name: Prsch0
    description: PRS ch 0 triggers scan sequence.
    value: 0
  - name: Prsch1
    description: PRS ch 1 triggers scan sequence.
    value: 1
  - name: Prsch10
    description: PRS ch 10 triggers scan sequence.
    value: 10
  - name: Prsch11
    description: PRS ch 11 triggers scan sequence.
    value: 11
  - name: Prsch2
    description: PRS ch 2 triggers scan sequence.
    value: 2
  - name: Prsch3
    description: PRS ch 3 triggers scan sequence.
    value: 3
  - name: Prsch4
    description: PRS ch 4 triggers scan sequence.
    value: 4
  - name: Prsch5
    description: PRS ch 5 triggers scan sequence.
    value: 5
  - name: Prsch6
    description: PRS ch 6 triggers scan sequence.
    value: 6
  - name: Prsch7
    description: PRS ch 7 triggers scan sequence.
    value: 7
  - name: Prsch8
    description: PRS ch 8 triggers scan sequence.
    value: 8
  - name: Prsch9
    description: PRS ch 9 triggers scan sequence.
    value: 9
enum/vals::ScanctrlRef:
  bit_size: 3
  variants:
  - name: Extsingle
    description: Single ended external reference from ADCn_CH6.
    value: 4
  - name: Vdd
    description: VDD.
    value: 2
  - name: _1v25
    description: Internal 1.25 V reference.
    value: 0
  - name: _2v5
    description: Internal 2.5 V reference.
    value: 1
  - name: _2xextdiff
    description: Differential external reference, 2x(ADCn_CH6 - ADCn_CH7).
    value: 5
  - name: _2xvdd
    description: Unbuffered 2xVDD.
    value: 6
  - name: _5vdiff
    description: Internal differential 5 V reference.
    value: 3
enum/vals::ScanctrlRes:
  bit_size: 2
  variants:
  - name: Ovs
    description: Oversampling enabled. Oversampling rate is set in OVSRSEL.
    value: 3
  - name: _12bit
    description: 12-bit resolution.
    value: 0
  - name: _6bit
    description: 6-bit resolution.
    value: 2
  - name: _8bit
    description: 8-bit resolution.
    value: 1
enum/vals::Scandatasrc:
  bit_size: 3
  variants:
  - name: Ch0
    description: 'Single ended mode: SCANDATA result originates from ADCn_CH0. Differential mode: SCANDATA result originates from ADCn_CH0-ADCn_CH1.'
    value: 0
  - name: Ch1
    description: 'Single ended mode: SCANDATA result originates from ADCn_CH1. Differential mode: SCANDATA result originates from ADCn_CH2_ADCn_CH3.'
    value: 1
  - name: Ch2
    description: 'Single ended mode: SCANDATA result originates from ADCn_CH2. Differential mode: SCANDATA result originates from ADCn_CH4-ADCn_CH5.'
    value: 2
  - name: Ch3
    description: 'Single ended mode: SCANDATA result originates from ADCn_CH3. Differential mode: SCANDATA result originates from ADCn_CH6-ADCn_CH7.'
    value: 3
  - name: Ch4
    description: SCANDATA result originates from ADCn_CH4.
    value: 4
  - name: Ch5
    description: SCANDATA result originates from ADCn_CH5.
    value: 5
  - name: Ch6
    description: SCANDATA result originates from ADCn_CH6.
    value: 6
  - name: Ch7
    description: SCANDATA result originates from ADCn_CH7.
    value: 7
enum/vals::SinglectrlAt:
  bit_size: 4
  variants:
  - name: _128cycles
    description: 128 ADC_CLK cycles acquisition time for single sample.
    value: 7
  - name: _16cycles
    description: 16 ADC_CLK cycles acquisition time for single sample.
    value: 4
  - name: _1cycle
    description: 1 ADC_CLK cycle acquisition time for single sample.
    value: 0
  - name: _256cycles
    description: 256 ADC_CLK cycles acquisition time for single sample.
    value: 8
  - name: _2cycles
    description: 2 ADC_CLK cycles acquisition time for single sample.
    value: 1
  - name: _32cycles
    description: 32 ADC_CLK cycles acquisition time for single sample.
    value: 5
  - name: _4cycles
    description: 4 ADC_CLK cycles acquisition time for single sample.
    value: 2
  - name: _64cycles
    description: 64 ADC_CLK cycles acquisition time for single sample.
    value: 6
  - name: _8cycles
    description: 8 ADC_CLK cycles acquisition time for single sample.
    value: 3
enum/vals::SinglectrlPrssel:
  bit_size: 4
  variants:
  - name: Prsch0
    description: PRS ch 0 triggers single sample.
    value: 0
  - name: Prsch1
    description: PRS ch 1 triggers single sample.
    value: 1
  - name: Prsch10
    description: PRS ch 10 triggers single sample.
    value: 10
  - name: Prsch11
    description: PRS ch 11 triggers single sample.
    value: 11
  - name: Prsch2
    description: PRS ch 2 triggers single sample.
    value: 2
  - name: Prsch3
    description: PRS ch 3 triggers single sample.
    value: 3
  - name: Prsch4
    description: PRS ch 4 triggers single sample.
    value: 4
  - name: Prsch5
    description: PRS ch 5 triggers single sample.
    value: 5
  - name: Prsch6
    description: PRS ch 6 triggers single sample.
    value: 6
  - name: Prsch7
    description: PRS ch 7 triggers single sample.
    value: 7
  - name: Prsch8
    description: PRS ch 8 triggers single sample.
    value: 8
  - name: Prsch9
    description: PRS ch 9 triggers single sample.
    value: 9
enum/vals::SinglectrlRef:
  bit_size: 3
  variants:
  - name: Extsingle
    description: Single ended external reference from ADCn_CH6.
    value: 4
  - name: Vdd
    description: Buffered VDD.
    value: 2
  - name: _1v25
    description: Internal 1.25 V reference.
    value: 0
  - name: _2v5
    description: Internal 2.5 V reference.
    value: 1
  - name: _2xextdiff
    description: Differential external reference, 2x(ADCn_CH6 - ADCn_CH7).
    value: 5
  - name: _2xvdd
    description: Unbuffered 2xVDD.
    value: 6
  - name: _5vdiff
    description: Internal differential 5 V reference.
    value: 3
enum/vals::SinglectrlRes:
  bit_size: 2
  variants:
  - name: Ovs
    description: Oversampling enabled. Oversampling rate is set in OVSRSEL.
    value: 3
  - name: _12bit
    description: 12-bit resolution.
    value: 0
  - name: _6bit
    description: 6-bit resolution.
    value: 2
  - name: _8bit
    description: 8-bit resolution.
    value: 1
enum/vals::Warmupmode:
  bit_size: 2
  variants:
  - name: Fastbg
    description: Bandgap references do not need warm up, but have reduced accuracy.
    value: 1
  - name: Keepadcwarm
    description: ADC is kept warmed up and scan reference is kept warm.
    value: 3
  - name: Keepscanrefwarm
    description: Reference selected for scan mode is kept warm.
    value: 2
  - name: Normal
    description: ADC is shut down after each conversion.
    value: 0
