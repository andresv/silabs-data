enum/vals::Aregasc:
  bit_size: 2
  variants:
  - name: Noshift
    description: No Shift operation on Animation Register A.
    value: 0
  - name: Shiftleft
    description: Animation Register A is shifted left.
    value: 1
  - name: Shiftright
    description: Animation Register A is shifted right.
    value: 2
enum/vals::Aregbsc:
  bit_size: 2
  variants:
  - name: Noshift
    description: No Shift operation on Animation Register B.
    value: 0
  - name: Shiftleft
    description: Animation Register B is shifted left.
    value: 1
  - name: Shiftright
    description: Animation Register B is shifted right.
    value: 2
enum/vals::Bias:
  bit_size: 2
  variants:
  - name: Onefourth
    description: 1/4 Bias.
    value: 3
  - name: Onehalf
    description: 1/2 Bias.
    value: 1
  - name: Onethird
    description: 1/3 Bias.
    value: 2
  - name: Static
    description: Static.
    value: 0
enum/vals::Conlev:
  bit_size: 5
  variants:
  - name: Max
    description: Maximum contrast.
    value: 31
  - name: Min
    description: Minimum contrast.
    value: 0
enum/vals::Fcpresc:
  bit_size: 2
  variants:
  - name: Div1
    description: CLKFC = CLKFRAME / 1.
    value: 0
  - name: Div2
    description: CLKFC = CLKFRAME / 2.
    value: 1
  - name: Div4
    description: CLKFC = CLKFRAME / 4.
    value: 2
  - name: Div8
    description: CLKFC = CLKFRAME / 8.
    value: 3
enum/vals::Mux:
  bit_size: 2
  variants:
  - name: Duplex
    description: Duplex.
    value: 1
  - name: Quadruplex
    description: Quadruplex.
    value: 3
  - name: Static
    description: Static.
    value: 0
  - name: Triplex
    description: Triplex.
    value: 2
enum/vals::Udctrl:
  bit_size: 2
  variants:
  - name: Fcevent
    description: The data transfer is done at the next event triggered by the Frame Counter.
    value: 1
  - name: Framestart
    description: The data transfer is done continuously at every LCD frame start.
    value: 2
  - name: Regular
    description: The data transfer is controlled by SW. Transfer is performed as soon as possible.
    value: 0
enum/vals::Vblev:
  bit_size: 3
  variants:
  - name: Level0
    description: Minimum boost level.
    value: 0
  - name: Level1
    value: 1
  - name: Level2
    value: 2
  - name: Level3
    value: 3
  - name: Level4
    value: 4
  - name: Level5
    value: 5
  - name: Level6
    value: 6
  - name: Level7
    description: Maximum boost level.
    value: 7
