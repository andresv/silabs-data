fieldset/regs::Status:
  description: Status Register.
  fields:
  - name: dir
    description: Current Counter Direction.
    bit_offset: 0
    bit_size: 1
fieldset/regs::Syncbusy:
  description: Synchronization Busy Register.
  fields:
  - name: ctrl
    description: CTRL Register Busy.
    bit_offset: 0
    bit_size: 1
  - name: cmd
    description: CMD Register Busy.
    bit_offset: 1
    bit_size: 1
  - name: topb
    description: TOPB Register Busy.
    bit_offset: 2
    bit_size: 1
fieldset/regs::Top:
  description: Top Value Register.
  fields:
  - name: top
    description: Counter Top Value.
    bit_offset: 0
    bit_size: 16
fieldset/regs::Topb:
  description: Top Value Buffer Register.
  fields:
  - name: topb
    description: Counter Top Buffer.
    bit_offset: 0
    bit_size: 16
enum/vals::Auxcntev:
  bit_size: 2
  variants:
  - name: Both
    description: Counts up on both up-count and down-count events.
    value: 3
  - name: Down
    description: Counts up on down-count events.
    value: 2
  - name: None
    description: Never counts.
    value: 0
  - name: Up
    description: Counts up on up-count events.
    value: 1
enum/vals::Cntev:
  bit_size: 2
  variants:
  - name: Both
    description: Counts up on up-count and down on down-count events.
    value: 0
  - name: Down
    description: Only counts down on down-count events.
    value: 2
  - name: None
    description: Never counts.
    value: 3
  - name: Up
    description: Only counts up on up-count events.
    value: 1
enum/vals::Location:
  bit_size: 3
  variants:
  - name: Loc0
    description: Location 0.
    value: 0
  - name: Loc1
    description: Location 1.
    value: 1
  - name: Loc2
    description: Location 2.
    value: 2
  - name: Loc3
    description: Location 3.
    value: 3
enum/vals::Mode:
  bit_size: 2
  variants:
  - name: Disable
    description: The module is disabled.
    value: 0
  - name: Extclkquad
    description: Externally clocked quadrature decoder mode (available in EM0-EM3).
    value: 3
  - name: Extclksingle
    description: Externally clocked single input counter mode (available in EM0-EM3).
    value: 2
  - name: Ovssingle
    description: Single input LFACLK oversampling mode (available in EM0-EM2).
    value: 1
