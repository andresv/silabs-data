    byte_offset: 28
    access: Write
    fieldset: regs::Ifs
  - name: ifc
    description: Interrupt Flag Clear Register.
    byte_offset: 32
    access: Write
    fieldset: regs::Ifc
  - name: ien
    description: Interrupt Enable Register.
    byte_offset: 36
    fieldset: regs::Ien
  - name: route
    description: I/O Routing Register.
    byte_offset: 40
    fieldset: regs::Route
  - name: freeze
