block/Pcnt:
  description: PCNT peripheral.
  items:
  - name: ctrl
    description: Control Register.
    byte_offset: 0
    fieldset: regs::Ctrl
  - name: cmd
    description: Command Register.
    byte_offset: 4
    access: Write
    fieldset: regs::Cmd
  - name: status
    description: Status Register.
    byte_offset: 8
    access: Read
    fieldset: regs::Status
  - name: cnt
    description: Counter Value Register.
    byte_offset: 12
    access: Read
    fieldset: regs::Cnt
  - name: top
    description: Top Value Register.
    byte_offset: 16
    access: Read
    fieldset: regs::Top
  - name: topb
    description: Top Value Buffer Register.
    byte_offset: 20
    fieldset: regs::Topb
  - name: if_
