  - name: s0prsen
    description: S0IN PRS Enable.
    bit_offset: 4
    bit_size: 1
  - name: s1prssel
    description: S1IN PRS Channel Select.
    bit_offset: 6
    bit_size: 4
    enum: vals::S1prssel
  - name: s1prsen
    description: S1IN PRS Enable.
    bit_offset: 10
    bit_size: 1
fieldset/regs::Route:
  description: I/O Routing Register.
  fields:
  - name: location
    description: I/O Location.
    bit_offset: 8
    bit_size: 3
