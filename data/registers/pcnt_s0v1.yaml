    bit_size: 1
  - name: of
    description: Overflow Interrupt Read Flag.
    bit_offset: 1
    bit_size: 1
  - name: dircng
    description: Direction Change Detect Interrupt Flag.
    bit_offset: 2
    bit_size: 1
  - name: auxof
    description: Overflow Interrupt Read Flag.
    bit_offset: 3
    bit_size: 1
fieldset/regs::Ifc:
