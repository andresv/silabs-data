    byte_offset: 44
    fieldset: regs::Freeze
  - name: syncbusy
    description: Synchronization Busy Register.
    byte_offset: 48
    access: Read
    fieldset: regs::Syncbusy
  - name: auxcnt
    description: Auxiliary Counter Value Register.
    byte_offset: 56
    fieldset: regs::Auxcnt
  - name: input
    description: PCNT Input Register.
    byte_offset: 60
    fieldset: regs::Input
fieldset/regs::Auxcnt:
  description: Auxiliary Counter Value Register.
  fields:
  - name: auxcnt
    description: Auxiliary Counter Value.
    bit_offset: 0
    bit_size: 16
fieldset/regs::Cmd:
  description: Command Register.
  fields:
  - name: lcntim
    description: Load CNT Immediately.
    bit_offset: 0
    bit_size: 1
  - name: ltopbim
    description: Load TOPB Immediately.
    bit_offset: 1
    bit_size: 1
fieldset/regs::Cnt:
  description: Counter Value Register.
  fields:
  - name: cnt
    description: Counter Value.
    bit_offset: 0
    bit_size: 16
fieldset/regs::Ctrl:
  description: Control Register.
  fields:
  - name: mode
    description: Mode Select.
    bit_offset: 0
    bit_size: 2
    enum: vals::Mode
  - name: cntdir
    description: Non-Quadrature Mode Counter Direction Control.
    bit_offset: 2
    bit_size: 1
  - name: edge
    description: Edge Select.
    bit_offset: 3
    bit_size: 1
  - name: filt
    description: Enable Digital Pulse Width Filter.
    bit_offset: 4
    bit_size: 1
  - name: rsten
    description: Enable PCNT Clock Domain Reset.
    bit_offset: 5
    bit_size: 1
  - name: hyst
    description: Enable Hysteresis.
    bit_offset: 8
    bit_size: 1
  - name: s1cdir
    description: Count direction determined by S1.
    bit_offset: 9
    bit_size: 1
  - name: cntev
    description: Controls when the counter counts.
    bit_offset: 10
    bit_size: 2
    enum: vals::Cntev
  - name: auxcntev
    description: Controls when the auxiliary counter counts.
    bit_offset: 14
    bit_size: 2
    enum: vals::Auxcntev
fieldset/regs::Freeze:
  description: Freeze Register.
  fields:
  - name: regfreeze
    description: Register Update Freeze.
    bit_offset: 0
    bit_size: 1
fieldset/regs::Ien:
  description: Interrupt Enable Register.
  fields:
  - name: uf
    description: Underflow Interrupt Enable.
    bit_offset: 0
    bit_size: 1
  - name: of
    description: Overflow Interrupt Enable.
    bit_offset: 1
    bit_size: 1
  - name: dircng
    description: Direction Change Detect Interrupt Enable.
    bit_offset: 2
    bit_size: 1
  - name: auxof
    description: Auxiliary Overflow Interrupt Enable.
    bit_offset: 3
    bit_size: 1
fieldset/regs::If:
