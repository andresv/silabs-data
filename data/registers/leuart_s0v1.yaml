    description: Transmission of new frames are delayed by two baud periods.
    value: 2
  - name: None
    description: Frames are transmitted immediately.
    value: 0
  - name: Single
    description: Transmission of new frames are delayed by a single baud period.
    value: 1
  - name: Triple
    description: Transmission of new frames are delayed by three baud periods.
    value: 3
