enum/vals::Ch0CtrlEdsel:
  bit_size: 2
  variants:
  - name: Bothedges
    description: A one HFPERCLK clock cycle pulse is generated for every edge of the incoming signal.
    value: 3
  - name: Negedge
    description: A one HFPERCLK clock cycle pulse is generated for every negative edge of the incoming signal.
    value: 2
  - name: Off
    description: Signal is left as it is.
    value: 0
  - name: Posedge
    description: A one HFPERCLK cycle pulse is generated for every positive edge of the incoming signal.
    value: 1
