fieldset/regs::Txdata:
  description: Transmit Buffer Data Register.
  fields:
  - name: txdata
    description: TX Data.
    bit_offset: 0
    bit_size: 8
enum/vals::Bito:
  bit_size: 2
  variants:
  - name: Off
    description: Timeout disabled.
    value: 0
  - name: Pcc160
    description: Timeout after 160 prescaled clock cycles. In standard mode at 100 kHz, this results in a 200us timeout.
    value: 3
  - name: Pcc40
    description: Timeout after 40 prescaled clock cycles. In standard mode at 100 kHz, this results in a 50us timeout.
    value: 1
  - name: Pcc80
    description: Timeout after 80 prescaled clock cycles. In standard mode at 100 kHz, this results in a 100us timeout.
    value: 2
enum/vals::Clhr:
  bit_size: 2
  variants:
  - name: Asymmetric
    description: The ratio between low period and high period counters (Nlow:Nhigh) is 6:3.
    value: 1
  - name: Fast
    description: The ratio between low period and high period counters (Nlow:Nhigh) is 11:6.
    value: 2
  - name: Standard
    description: The ratio between low period and high period counters (Nlow:Nhigh) is 4:4.
    value: 0
enum/vals::Clto:
  bit_size: 3
  variants:
  - name: Off
    description: Timeout disabled.
    value: 0
  - name: Pcc1024
    description: Timeout after 1024 prescaled clock cycles. In standard mode at 100 kHz, this results in a 1280us timeout.
    value: 5
  - name: Pcc160
    description: Timeout after 160 prescaled clock cycles. In standard mode at 100 kHz, this results in a 200us timeout.
    value: 3
  - name: Pcc320
    description: Timeout after 320 prescaled clock cycles. In standard mode at 100 kHz, this results in a 400us timeout.
    value: 4
  - name: Pcc40
    description: Timeout after 40 prescaled clock cycles. In standard mode at 100 kHz, this results in a 50us timeout.
    value: 1
  - name: Pcc80
    description: Timeout after 80 prescaled clock cycles. In standard mode at 100 kHz, this results in a 100us timeout.
    value: 2
enum/vals::Location:
  bit_size: 3
  variants:
  - name: Loc0
    description: Location 0.
    value: 0
  - name: Loc1
    description: Location 1.
    value: 1
  - name: Loc2
    description: Location 2.
    value: 2
  - name: Loc3
    description: Location 3.
    value: 3
  - name: Loc4
    description: Location 4.
    value: 4
  - name: Loc5
    description: Location 5.
    value: 5
  - name: Loc6
    description: Location 6.
    value: 6
enum/vals::State:
  bit_size: 3
  variants:
  - name: Addr
    description: Address transmitted or received.
    value: 3
  - name: Addrack
    description: Address ack/nack transmitted or received.
    value: 4
  - name: Data
    description: Data transmitted or received.
    value: 5
  - name: Dataack
    description: Data ack/nack transmitted or received.
    value: 6
  - name: Idle
    description: No transmission is being performed.
    value: 0
  - name: Start
    description: Start transmitted or received.
    value: 2
  - name: Wait
    description: Waiting for idle. Will send a start condition as soon as the bus is idle.
    value: 1
