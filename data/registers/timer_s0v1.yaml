enum/vals::Cc0CtrlCmoa:
  bit_size: 2
  variants:
  - name: Clear
    description: Clear output on compare match.
    value: 2
  - name: None
    description: No action on compare match.
    value: 0
  - name: Set
    description: Set output on compare match.
    value: 3
  - name: Toggle
    description: Toggle output on compare match.
    value: 1
enum/vals::Cc0CtrlCofoa:
  bit_size: 2
  variants:
  - name: Clear
    description: Clear output on counter overflow.
    value: 2
  - name: None
    description: No action on counter overflow.
    value: 0
  - name: Set
    description: Set output on counter overflow.
    value: 3
  - name: Toggle
    description: Toggle output on counter overflow.
    value: 1
enum/vals::Cc0CtrlCufoa:
  bit_size: 2
  variants:
  - name: Clear
    description: Clear output on counter underflow.
    value: 2
  - name: None
    description: No action on counter underflow.
    value: 0
  - name: Set
    description: Set output on counter underflow.
    value: 3
  - name: Toggle
    description: Toggle output on counter underflow.
    value: 1
enum/vals::Cc0CtrlIcedge:
  bit_size: 2
  variants:
  - name: Both
    description: Both edges detected.
    value: 2
  - name: Falling
    description: Falling edges detected.
    value: 1
  - name: None
    description: No edge detection, signal is left as it is.
    value: 3
  - name: Rising
    description: Rising edges detected.
    value: 0
enum/vals::Cc0CtrlIcevctrl:
  bit_size: 2
  variants:
  - name: Everyedge
    description: PRS output pulse, interrupt flag and DMA request set on every capture.
    value: 0
  - name: Everysecondedge
    description: PRS output pulse, interrupt flag and DMA request set on every second capture.
    value: 1
  - name: Falling
    description: PRS output pulse, interrupt flag and DMA request set on falling edge only (if ICEDGE = BOTH).
    value: 3
  - name: Rising
    description: PRS output pulse, interrupt flag and DMA request set on rising edge only (if ICEDGE = BOTH).
    value: 2
enum/vals::Cc0CtrlMode:
  bit_size: 2
  variants:
  - name: Inputcapture
    description: Input capture.
    value: 1
  - name: Off
    description: Compare/Capture channel turned off.
    value: 0
  - name: Outputcompare
    description: Output compare.
    value: 2
  - name: Pwm
    description: Pulse-Width Modulation.
    value: 3
enum/vals::Cc0CtrlPrssel:
  bit_size: 4
  variants:
  - name: Prsch0
    description: PRS Channel 0 selected as input.
    value: 0
  - name: Prsch1
    description: PRS Channel 1 selected as input.
    value: 1
