    description: PRS Channel 10 selected as input.
    value: 10
  - name: Prsch11
    description: PRS Channel 11 selected as input.
    value: 11
  - name: Prsch2
    description: PRS Channel 2 selected as input.
    value: 2
  - name: Prsch3
    description: PRS Channel 3 selected as input.
    value: 3
  - name: Prsch4
    description: PRS Channel 4 selected as input.
    value: 4
  - name: Prsch5
    description: PRS Channel 5 selected as input.
    value: 5
  - name: Prsch6
    description: PRS Channel 6 selected as input.
    value: 6
