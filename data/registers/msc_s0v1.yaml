enum/vals::Busstrategy:
  bit_size: 2
  variants:
  - name: Cpu
    value: 0
  - name: Dma
    value: 1
  - name: Dmaem1
    value: 2
  - name: None
    value: 3
enum/vals::LockLockkey:
  bit_size: 16
  variants:
  - name: Locked
    value: 1
  - name: Unlocked
    value: 0
enum/vals::MasslockLockkey:
  bit_size: 16
  variants:
  - name: Locked
    description: Mass erase locked.
    value: 1
  - name: Unlocked
    description: Mass erase unlocked.
    value: 0
enum/vals::Mode:
  bit_size: 3
  variants:
  - name: Ws0
    description: Zero wait-states inserted in fetch or read transfers.
    value: 0
  - name: Ws0scbtp
    description: Zero wait-states inserted with the Suppressed Conditional Branch Target Prefetch (SCBTP) function enabled. SCBTP saves energy by delaying the Cortex' conditional branch target prefetches until the conditional branch instruction is in the execute stage. When the instruction reaches this stage, the evaluation of the branch condition is completed and the core does not perform a speculative prefetch of both the branch target address and the next sequential address. With the SCBTP function enabled, one instruction fetch is saved for each branch not taken, with a negligible performance penalty.
    value: 2
  - name: Ws1
    description: One wait-state inserted for each fetch or read transfer. This mode is required for a core frequency above 16 MHz.
    value: 1
  - name: Ws1scbtp
    description: One wait-state access with SCBTP enabled.
    value: 3
  - name: Ws2
    description: Two wait-states inserted for each fetch or read transfer. This mode is required for a core frequency above 32 MHz.
    value: 4
  - name: Ws2scbtp
    description: Two wait-state access with SCBTP enabled.
    value: 5
