enum/vals::Cc0CtrlCmoa:
  bit_size: 2
  variants:
  - name: Clear
    description: Clear output on compare match.
    value: 2
  - name: Pulse
    description: A single clock cycle pulse is generated on output.
    value: 0
  - name: Set
    description: Set output on compare match.
    value: 3
  - name: Toggle
    description: Toggle output on compare match.
    value: 1
enum/vals::Cc0CtrlCompbase:
  bit_size: 1
  variants:
  - name: Cnt
    description: RTCC_CCx_ICVALUE/OCVALUE is compared with CNT register.
    value: 0
  - name: Precnt
    description: Least significant bits of RTCC_CCx_ICVALUE/OCVALUE are compared with COMBCNT.
    value: 1
enum/vals::Cc0CtrlIcedge:
  bit_size: 2
  variants:
  - name: Both
    description: Both edges detected.
    value: 2
  - name: Falling
    description: Falling edges detected.
    value: 1
  - name: None
    description: No edge detection, signal is left as it is.
    value: 3
  - name: Rising
    description: Rising edges detected.
    value: 0
enum/vals::Cc0CtrlMode:
  bit_size: 2
  variants:
  - name: Inputcapture
    description: Input capture.
    value: 1
  - name: Off
    description: Compare/Capture channel turned off.
    value: 0
  - name: Outputcompare
    description: Output compare.
    value: 2
enum/vals::Cc1CtrlCmoa:
  bit_size: 2
  variants:
