    value: 1
  - name: None
    description: No edge detection, signal is left as it is.
    value: 3
  - name: Rising
    description: Rising edges detected.
    value: 0
enum/vals::Cc1CtrlMode:
  bit_size: 2
  variants:
  - name: Inputcapture
    description: Input capture.
    value: 1
  - name: Off
    description: Compare/Capture channel turned off.
    value: 0
  - name: Outputcompare
    description: Output compare.
    value: 2
enum/vals::Cntpresc:
  bit_size: 4
  variants:
  - name: Div1
    description: CLK_CNT = (RTCC LF CLK)/1.
    value: 0
  - name: Div1024
    description: CLK_CNT = (RTCC LF CLK)/1024.
    value: 10
  - name: Div128
    description: CLK_CNT = (RTCC LF CLK)/128.
    value: 7
  - name: Div16
    description: CLK_CNT = (RTCC LF CLK)/16.
    value: 4
  - name: Div16384
    description: CLK_CNT = (RTCC LF CLK)/16384.
    value: 14
  - name: Div2
    description: CLK_CNT = (RTCC LF CLK)/2.
    value: 1
  - name: Div2048
    description: CLK_CNT = (RTCC LF CLK)/2048.
    value: 11
  - name: Div256
    description: CLK_CNT = (RTCC LF CLK)/256.
    value: 8
  - name: Div32
    description: CLK_CNT = (RTCC LF CLK)/32.
    value: 5
  - name: Div32768
    description: CLK_CNT = (RTCC LF CLK)/32768.
    value: 15
  - name: Div4
    description: CLK_CNT = (RTCC LF CLK)/4.
    value: 2
  - name: Div4096
    description: CLK_CNT = (RTCC LF CLK)/4096.
    value: 12
  - name: Div512
    description: CLK_CNT = (RTCC LF CLK)/512.
    value: 9
  - name: Div64
    description: CLK_CNT = (RTCC LF CLK)/64.
    value: 6
  - name: Div8
    description: CLK_CNT = (RTCC LF CLK)/8.
    value: 3
  - name: Div8192
    description: CLK_CNT = (RTCC LF CLK)/8192.
    value: 13
enum/vals::Cnttick:
  bit_size: 1
  variants:
  - name: Ccv0match
    description: CNT register ticks when PRECNT matches RTCC_CC0_OC[14:0].
    value: 1
  - name: Presc
    description: CNT register ticks according to configuration in CNTPRESC.
    value: 0
enum/vals::Debugrun:
  bit_size: 1
  variants:
  - name: X0
    description: RTCC is frozen in debug mode.
    value: 0
  - name: X1
    description: RTCC is running in debug mode.
    value: 1
enum/vals::Lockkey:
  bit_size: 16
  variants:
  - name: Unlock
    description: Write to unlock RTCC lockable registers.
    value: 44776
