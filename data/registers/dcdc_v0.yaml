    byte_offset: 4
    fieldset: regs::En
  - name: ctrl
    description: Control.
    byte_offset: 8
    fieldset: regs::Ctrl
  - name: em01ctrl0
    description: EM01 Configurations.
    byte_offset: 16
    fieldset: regs::Em01ctrl0
  - name: em23ctrl0
    description: EM23 Configurations.
    byte_offset: 20
    fieldset: regs::Em23ctrl0
