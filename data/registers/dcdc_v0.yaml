    description: Bypass Comparator Output.
    bit_offset: 4
    bit_size: 1
enum/vals::Dcmonlyen:
  bit_size: 1
  variants:
  - name: Dcmonlyen
    description: DCM only mode for normal operation, this is the default setting.
    value: 1
  - name: Dualmode
    description: Support higher load current at lower battery voltage by working in CCM mode.
    value: 0
enum/vals::Em01ctrl0Drvspeed:
  bit_size: 2
  variants:
  - name: BestEfficiency
    description: Not recommended for use (no benefit to this setting).
    value: 3
  - name: BestEmi
    description: Not recommended for use (no benefit to this setting).
    value: 0
  - name: DefaultSetting
    description: Recommended for use for best efficiency and low EMI.
    value: 1
  - name: Intermediate
    description: Not recommended for use (no benefit to this setting).
    value: 2
enum/vals::Em01ctrl0Ipkval:
  bit_size: 4
  variants:
  - name: Load36mA
    description: Ipeak = 90mA, Iload = 36mA.
    value: 3
  - name: Load40mA
    description: Ipeak = 100mA, Iload = 40mA.
    value: 4
  - name: Load44mA
    description: Ipeak = 110mA, Iload = 44mA.
    value: 5
  - name: Load48mA
    description: Ipeak = 120mA, Iload = 48mA.
    value: 6
  - name: Load52mA
    description: Ipeak = 130mA, Iload = 52mA.
    value: 7
  - name: Load56mA
    description: Ipeak = 140mA, Iload = 56mA.
    value: 8
  - name: Load60mA
    description: Ipeak = 150mA, Iload = 60mA.
    value: 9
enum/vals::Em23ctrl0Drvspeed:
  bit_size: 2
  variants:
  - name: BestEfficiency
    description: Not recommended for use (no benefit to this setting).
    value: 3
  - name: BestEmi
    description: Not recommended for use (no benefit to this setting).
    value: 0
  - name: DefaultSetting
    description: Recommended for use for best efficiency and low EMI.
    value: 1
  - name: Intermediate
    description: Not recommended for use (no benefit to this setting).
    value: 2
enum/vals::Em23ctrl0Ipkval:
  bit_size: 4
  variants:
  - name: Load10ma
    description: Ipeak = 150mA, Iload = 10 mA.
    value: 9
  - name: Load5ma
    description: Ipeak = 90mA, Iload = 5 mA.
    value: 3
enum/vals::Ipktmaxctrl:
  bit_size: 3
  variants:
  - name: Off
    description: Ton_max disabled.
    value: 0
  - name: Tmax0p35us
    description: 0.35us.
    value: 1
  - name: Tmax0p63us
    description: 0.63us.
    value: 2
  - name: Tmax0p91us
    description: 0.91us.
    value: 3
  - name: Tmax1p19us
    description: 1.19us.
    value: 4
  - name: Tmax1p47us
    description: 1.47us.
    value: 5
  - name: Tmax1p75us
    description: 1.75us.
    value: 6
  - name: Tmax2p03us
    description: 2.03us.
    value: 7
enum/vals::Lockkey:
  bit_size: 16
  variants:
  - name: Unlockkey
    description: Value to write to unlock.
    value: 43981
enum/vals::Mode:
  bit_size: 1
  variants:
  - name: Bypass
    description: DCDC is OFF, bypass switch is enabled.
    value: 0
  - name: Dcdcregulation
    description: Request DCDC regulation, bypass switch disabled.
    value: 1
