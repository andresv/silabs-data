# GPIO transforms.
#
# Recover the PORT[A-D]_* register array. `efr32mg26_gpio.h` defines
# `GPIO_PORT_TypeDef P[4];`, but the SVD does not mark it as a CMSIS <dim>
# array.
#
# The extractor uses `NamespaceMode::BlockWithRegsVals` and renames the
# block to its kind, so the names here are:
#   - block id:       `Gpio`
#   - fieldset ids:   `regs::PORTA_CTRL`, ...
#   - enum ids:       `vals::...`
#
# Series 2 ports differ: PORTA/PORTC have MODEH, PORTB/PORTD do not.
# `check: NoCheck` lets the merge accept fields that only some ports have.
# The result is the union of all port layouts, as in `GPIO_PORT_TypeDef`.
transforms:
  # Merge per-port fieldsets into a single shape per register kind.
  # PORTA/PORTB/PORTC/PORTD share register layouts at stride 0x30.
  - !MergeFieldsets
      from: ^regs::PORT[A-D]_(CTRL|MODEL|MODEH|DOUT|DIN)$
      to: regs::PORT_$1
      check: NoCheck
  # Then collapse the per-port registers into a single P_<reg> array.
  - !MakeRegisterArray
      blocks: ^GPIO$
      from: ^PORT([A-D])_(.*)$
      to: P_$2
      check: Layout
