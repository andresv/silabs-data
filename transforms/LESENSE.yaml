# LESENSE transforms.
#
# The SVD models the 64 decoder state-transition registers as 64 separate
# registers ST0_ARC..ST63_ARC (contiguous at offset 0x200, stride 0x4), each
# with its own identical fieldset and its own identical PRSACT enum.
#
#   1. Drop the PRSACT enums. PRSACT is a 3-bit field, but the SVD lists 12
#      enumeratedValues: values 1/2/5/6 each carry TWO meanings selected by a
#      *separate* PRSCOUNT bit (PRS-output pulses when PRSCOUNT==0; up/down
#      counter actions when PRSCOUNT==1). chiptool cannot represent an enum
#      with more variants than the field holds. A partial 8-value enum would
#      hide the second meaning. The raw 3-bit field stays. The Reference
#      Manual gives the meaning.
#   2. Recover the ST_ARC[64] register array that the SVD does not mark as a
#      CMSIS <dim>, as transforms/GPIO.yaml does for PORT[A-D].
#
# Names below are the raw pre-Sanitize UPPER_SNAKE forms (transforms run before
# the casing pass), same convention as transforms/GPIO.yaml.
transforms:
  # 1. Drop the 64 per-state PRSACT enums (also clears the field references,
  #    leaving prsact as a plain 3-bit integer).
  - !DeleteEnums
      from: ^vals::ST\d+_ARC_PRSACT$
  # 2. Merge the 64 per-state fieldsets, which are identical after step 1.
  - !MergeFieldsets
      from: ^regs::ST\d+_ARC$
      to: regs::ST_ARC
      check: NoCheck
  # 3. Collapse ST0_ARC..ST63_ARC into a single ST_ARC[64] register array.
  - !MakeRegisterArray
      blocks: ^LESENSE$
      from: ^ST(\d+)_ARC$
      to: ST_ARC
      check: Layout
